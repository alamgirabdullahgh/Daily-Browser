<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>এজেন্ট হাব</title>
<style>
:root{--bg:#f6f3ea;--card:#fff;--tx:#1b2b24;--mu:#6b7a72;--g:#0f5a3f;--bd:#e3ddcc;--w:#c98a00;--r:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#121a16;--card:#1b2620;--tx:#e8efe9;--mu:#93a39a;--g:#59c796;--bd:#2c3a33;--w:#e5b04a;--r:#f08a82}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Noto Sans Bengali",sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%}
header{padding:10px 14px;font-weight:700;color:var(--g);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}
#clr{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--bd);border-radius:14px;background:transparent;color:var(--r);padding:4px 10px;cursor:pointer}
main{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.ag{flex:1;min-width:95px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}
.ag b{display:block}.st{font-size:12px;color:var(--mu)}.working{border-color:var(--g)}.limit{border-color:var(--r)}.limit .st{color:var(--r)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.card .meta{font-size:12px;color:var(--mu);display:flex;justify-content:space-between}
.bar{height:6px;background:var(--bd);border-radius:4px;margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.queued .meta span:first-child{color:var(--w)}.done .meta span:first-child{color:var(--g)}
.del{cursor:pointer;color:var(--r);font-weight:700;margin-left:6px;padding:0 2px}
.ev{font-size:13px;color:var(--mu);padding:3px 0;border-bottom:1px dashed var(--bd)}.ev.sw{color:var(--w);font-weight:600}
footer{padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;gap:6px;width:100%}
.box{width:100%;border:1px solid var(--bd);border-radius:24px;background:var(--bg);padding:10px 10px 8px 14px;display:flex;flex-direction:column;gap:6px}
.box textarea{width:100%;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;font-size:16px;line-height:1.5;min-height:84px;max-height:45vh;resize:none;padding:0;overflow-y:auto;field-sizing:content}
.tools{display:flex;align-items:center;gap:8px}.tools .sp{flex:1}
.selw{position:relative}
#selb{font:inherit;font-size:14px;font-weight:600;color:var(--tx);background:transparent;border:1.5px solid var(--bd);border-radius:21px;height:42px;padding:0 14px;cursor:pointer;max-width:56vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{color:var(--mu);font-weight:400}
#selm{display:none;position:absolute;bottom:50px;left:0;min-width:200px;max-width:80vw;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:4px;z-index:9}
#selm.open{display:block}
.grp{padding:8px 12px 2px;font-size:12px;font-weight:700;color:var(--mu)}
.opt{padding:11px 12px;border-radius:10px;cursor:pointer;font-size:15px}.opt.on{background:var(--bg);font-weight:700}
.ic,.send{width:42px;height:42px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
.ic{background:transparent;border:1.5px solid var(--bd);color:var(--tx);font-size:26px;line-height:1;font-weight:300}
.send{background:var(--g);color:#fff}.send:disabled{opacity:.35}
.send svg{width:22px;height:22px}
#chips{display:flex;gap:8px;flex-wrap:wrap}#chips:empty{display:none}
.chip{display:flex;align-items:center;gap:6px;max-width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:4px 8px;font-size:13px}
.chip img{width:34px;height:34px;object-fit:cover;border-radius:6px}.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.chip b{cursor:pointer;color:var(--mu);padding:0 4px;font-size:16px}
.fl{font-size:12px;color:var(--mu);margin-top:4px}
input#tok{flex:1;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
#setup button{font:inherit;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:700}
#setup{padding:12px;display:none;flex-direction:column;gap:8px}
</style></head><body>
<header><span>🧭 এজেন্ট হাব</span><span style="display:flex;align-items:center;gap:10px"><span id="ts" style="font-weight:400;font-size:12px;color:var(--mu)"></span><button id="clr" type="button" onclick="clearChat()">🗑 চ্যাট সাফ</button></span></header>
<div id="setup"><b>প্রথমবার: GitHub টোকেন দিন (শুধু এই ফোনে থাকবে)</b><input id="tok" type="password" placeholder="github_pat_..."><button onclick="saveTok()" style="padding:10px">সংরক্ষণ</button></div>
<main id="m"><div id="tasks"></div><div><b style="font-size:13px">ঘটনা</b><div id="evs"></div></div></main>
<footer id="f"><div id="chips"></div><div class="box"><textarea id="t" rows="3" oninput="grow(this);upd()" onkeyup="grow(this)" onpaste="setTimeout(()=>grow(this),0)" placeholder="Write a message  ·  একাধিক এজেন্টকে একসাথে: নতুন লাইনে @gemini … @image … @audio …"></textarea><div class="tools"><button class="ic" type="button" aria-label="ফাইল যোগ করুন" onclick="document.getElementById('fi').click()">+</button><input id="fi" type="file" multiple hidden onchange="addFiles(this)"><div class="selw"><button id="selb" type="button" aria-label="এজেন্ট বাছুন" onclick="toggleSel(event)">Claude ▾</button><div id="selm"></div></div><span class="sp"></span><button class="send" id="sb" type="button" aria-label="পাঠাও" onclick="send()" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div></footer>
<script>
const REPO="alamgirabdullahgh/daily-ruqyah",BR="agent-bus",API=`https://api.github.com/repos/${REPO}/contents/bus.json`;
const tok=()=>localStorage.getItem("gh_tok")||"";
const H=()=>({Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json"});
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const enc=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function saveTok(){const v=document.getElementById("tok").value.trim();if(v){localStorage.setItem("gh_tok",v);start()}}
async function load(){const r=await fetch(API+"?ref="+BR+"&t="+Date.now(),{headers:H()});if(!r.ok)throw new Error(r.status);const j=await r.json();return{sha:j.sha,d:JSON.parse(dec(j.content))}}
const SN={working:"কাজ করছে",idle:"অলস",limit:"লিমিট শেষ"};
function draw(d){
  const SS={queued:"সারিতে",running:"চলছে",done:"শেষ"};
  document.getElementById("tasks").innerHTML=[...d.tasks].reverse().map(t=>`<div class="card ${t.status}" style="margin-bottom:8px"><div class="meta"><span>#${t.id} · ${SS[t.status]||t.status}${t.agent?" · "+esc(t.agent):(t.target&&t.status==="queued"?" · → "+esc(t.target):"")}</span><span>${t.progress}%${t.status!=="done"?` <b class="del" title="বাতিল" onclick="delTask(${t.id})">✕</b>`:""}</span></div><div>${esc(t.text)}</div><div class="bar"><i style="width:${t.progress}%"></i></div>${t.note?`<div class="st">${esc(t.note)}</div>`:""}${(t.files||[]).map(f=>`<div class="fl">📎 ${esc(f.name)} (${sz(f.size)})</div>`).join("")}</div>`).join("")||'<div class="st">এখনো কোনো কাজ নেই। নিচে কমান্ড লিখুন।</div>';
  document.getElementById("evs").innerHTML=[...d.events].reverse().slice(0,25).map(e=>`<div class="ev ${e.msg.includes("বদল")||e.msg.includes("লিমিট")?"sw":""}">${esc(e.t.slice(11))} — ${esc(e.msg)}</div>`).join("");
  document.getElementById("ts").textContent="হালনাগাদ "+new Date().toLocaleTimeString("bn-BD");
}
async function clearChat(){
  try{const{d}=await load();const nd=d.tasks.filter(t=>t.status==="done").length,ne=d.events.length,keep=d.tasks.length-nd;
    if(!nd&&!ne){alert("সাফ করার মতো কিছু নেই");return}
    if(!confirm("শেষ হওয়া "+nd+"টি কাজ ও "+ne+"টি ঘটনা মুছবেন?"+(keep?"\n("+keep+"টি সারির/চলমান কাজ থাকবে — এগুলো বাতিল করতে কার্ডের ✕ চাপুন)":"")))return;
    for(let i=0;i<4;i++){const{sha,d:x}=await load();x.seq=Math.max(x.seq||0,0,...x.tasks.map(t=>t.id));x.tasks=x.tasks.filter(t=>t.status!=="done");x.events=[];
      const r=await fetch(API,{method:"PUT",headers:H(),body:JSON.stringify({message:"bus: clear",branch:BR,sha,content:enc(JSON.stringify(x,null,1))})});
      if(r.ok){draw(x);return}await new Promise(r=>setTimeout(r,700))}
    alert("সাফ করা যায়নি, আবার চেষ্টা করুন")}catch(e){alert("সাফ করা যায়নি: "+e.message)}}
async function delTask(id){
  if(!confirm("কাজ #"+id+" বাতিল করবেন? এটা চলছে হলেও থেমে যাবে (চলমান এজেন্ট পরের বার দেখে আর এগোবে না)।"))return;
  for(let i=0;i<4;i++){try{const{sha,d}=await load();const before=d.tasks.length;d.tasks=d.tasks.filter(t=>t.id!==id);
    if(d.tasks.length===before){draw(d);return}
    d.events.push({t:now_(),msg:"কাজ #"+id+" বাতিল করা হলো"});d.events=d.events.slice(-60);
    const r=await fetch(API,{method:"PUT",headers:H(),body:JSON.stringify({message:"bus: cancel "+id,branch:BR,sha,content:enc(JSON.stringify(d,null,1))})});
    if(r.ok){draw(d);return}}catch(e){}await new Promise(r=>setTimeout(r,700))}
  alert("বাতিল করা যায়নি, আবার চেষ্টা করুন")}
function now_(){return new Date().toISOString().slice(0,16).replace("T"," ")}
async function refresh(){try{draw((await load()).d)}catch(e){document.getElementById("ts").textContent="সংযোগ সমস্যা ("+e.message+")"}}
let AGS=[{id:"claude",label:"Claude",ver:""}],SEL="";try{SEL=localStorage.getItem("ag_sel")||""}catch(e){}
const curAg=()=>AGS.find(a=>a.id===SEL)||AGS.find(a=>a.id==="claude")||AGS[0];
function drawSel(){const a=curAg();SEL=a.id;
  document.getElementById("selb").innerHTML=esc(a.label)+(a.ver?' <span class="v">'+esc(a.ver)+'</span>':'')+' ▾';
  const multi=new Set(AGS.map(x=>x.cat||'text')).size>1;let lg=null;
  const gcount={};AGS.forEach(x=>{const g=x.cat||'text';gcount[g]=(gcount[g]||0)+1});
  // একটা ক্যাটাগরিতে মাত্র একটাই এজেন্ট থাকলে আলাদা হেডিং দেখানো হয় না — নইলে "অডিও" হেডিংয়ের ঠিক নিচে
  // "অডিও এজেন্ট" অপশন এসে একই কথা দুইবার দেখাত। একাধিক থাকলে (যেমন কোডিং: Claude/Gemini/Grok) হেডিং থাকে।
  document.getElementById("selm").innerHTML=AGS.map(x=>{const g=x.cat||'text';let h='';if(multi&&g!==lg&&gcount[g]>1){lg=g;h='<div class="grp">'+esc(x.catLabel||'')+'</div>'}return h+'<div class="opt'+(x.id===SEL?' on':'')+'" data-id="'+esc(x.id)+'">'+esc(x.label)+(x.ver?' <span class="v">'+esc(x.ver)+'</span>':'')+'</div>'}).join("")}
function toggleSel(ev){ev.stopPropagation();document.getElementById("selm").classList.toggle("open")}
document.addEventListener("click",ev=>{const m=document.getElementById("selm"),o=ev.target.closest&&ev.target.closest(".opt");
  if(o){SEL=o.dataset.id;try{localStorage.setItem("ag_sel",SEL)}catch(e){}drawSel()}m.classList.remove("open")});
/* অ্যাপ ব্রাউজারের হোমপেজের ওয়ার্কস্পেস থেকে এজেন্টের তালিকা এখানে পাঠায় (নাম + জানা থাকলে সংস্করণ) */
window.setAgents=function(l){try{if(Array.isArray(l)&&l.length)AGS=l;drawSel()}catch(e){}};
drawSel();
const FILES=[];const MAXB=25*1024*1024;
const sz=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
function grow(e){e.style.height="0px";const h=Math.min(Math.max(e.scrollHeight,84),innerHeight*0.45);e.style.height=h+"px"}
function upd(){document.getElementById("sb").disabled=!(document.getElementById("t").value.trim()||FILES.length)}
function icon(f){return f.type.startsWith("audio")?"🎵":f.type.startsWith("video")?"🎬":f.type==="application/pdf"?"📕":"📄"}
function chips(){document.getElementById("chips").innerHTML=FILES.map((f,i)=>`<div class="chip">${f.type.startsWith("image")?`<img src="${f._u}">`:icon(f)}<span>${esc(f.name)} · ${sz(f.size)}</span><b onclick="rmFile(${i})">✕</b></div>`).join("");upd()}
function addFiles(inp){for(const f of inp.files){if(f.size>MAXB){alert(f.name+": ২৫ MB-এর বেশি ফাইল যোগ করা যায় না");continue}f._u=f.type.startsWith("image")?URL.createObjectURL(f):"";FILES.push(f)}inp.value="";chips()}
function rmFile(i){FILES.splice(i,1);chips()}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]||"");r.onerror=()=>no(r.error);r.readAsDataURL(f)});
async function upload(f,k){
  const safe=f.name.replace(/[^A-Za-z0-9._-]+/g,"_").slice(-60)||"file",path=`files/${Date.now()}-${k}-${safe}`;
  const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`,{method:"PUT",headers:H(),body:JSON.stringify({message:"bus: file",branch:BR,content:await b64(f)})});
  if(!r.ok)throw new Error("ফাইল আপলোড "+r.status);
  return{name:f.name,path,size:f.size,type:f.type||"application/octet-stream"}}
/* একটা কমান্ডে একাধিক এজেন্ট: নতুন লাইনের শুরুতে @gemini / @image / @audio / @claude … লিখলে ওই লাইন থেকে পরের মার্কার পর্যন্ত অংশ ওই এজেন্টের নিজের কাজ হয়ে যায়।
   মার্কার না থাকলে পুরোটা বাছা এজেন্টের কাজ (আগের মতো)। মার্কারের আগের লেখা থাকলে সেটা বাছা এজেন্টের। */
function splitTargets(body){
  const ids=AGS.map(a=>a.id),rx=/^[ \t]*@([A-Za-z]+)[ \t]*[:：]?[ \t]*/gm,hits=[];let m;
  while((m=rx.exec(body))){const k=m[1].toLowerCase();if(ids.includes(k))hits.push({k,i:m.index,e:rx.lastIndex})}
  if(!hits.length)return[{target:curAg().id,text:body}];
  const out=[],pre=body.slice(0,hits[0].i).trim();if(pre)out.push({target:curAg().id,text:pre});
  hits.forEach((h,j)=>{const x=body.slice(h.e,j+1<hits.length?hits[j+1].i:undefined).trim();if(x)out.push({target:h.k,text:x})});
  return out.length?out:[{target:curAg().id,text:body}]}
async function send(){
  const t=document.getElementById("t"),sb=document.getElementById("sb"),text=t.value.trim();if(!text&&!FILES.length)return;
  const fs=[...FILES];sb.disabled=true;t.disabled=true;let done=[];
  try{for(let k=0;k<fs.length;k++){document.getElementById("ts").textContent="ফাইল পাঠানো "+(k+1)+"/"+fs.length+"…";done.push(await upload(fs[k],k))}}
  catch(e){alert("ফাইল পাঠানো যায়নি: "+e.message);t.disabled=false;upd();return}
  const body=text||"(শুধু ফাইল — সংযুক্ত ফাইলগুলো দেখে কাজ করো)";
  const parts=splitTargets(body);
  for(let i=0;i<4;i++){try{const{sha,d}=await load();let id=Math.max(d.seq||0,0,...d.tasks.map(x=>x.id)),now=new Date().toISOString().slice(0,16).replace("T"," ");
    parts.forEach(p=>{id++;const task={id,text:p.text,status:"queued",agent:"",target:p.target,progress:0,note:"",created:now,updated:now};if(done.length)task.files=done;d.tasks.push(task);d.events.push({t:now,msg:"নতুন কাজ #"+id+" → "+p.target+": "+p.text.slice(0,60)+(done.length?" 📎"+done.length:"")})});
    d.seq=id;d.events=d.events.slice(-60);
    const r=await fetch(API,{method:"PUT",headers:H(),body:JSON.stringify({message:"bus: add",branch:BR,sha,content:enc(JSON.stringify(d,null,1))})});
    if(r.ok){t.value="";t.style.height="";t.disabled=false;FILES.length=0;chips();draw(d);return}}catch(e){}await new Promise(r=>setTimeout(r,700))}
  alert("পাঠানো যায়নি, আবার চেষ্টা করুন");t.disabled=false;upd()}
function start(){const ok=!!tok();document.getElementById("setup").style.display=ok?"none":"flex";document.getElementById("m").style.display=ok?"flex":"none";document.getElementById("f").style.display=ok?"flex":"none";upd();if(ok){refresh();clearInterval(window._i);window._i=setInterval(refresh,15000)}}
start();
</script></body></html>
