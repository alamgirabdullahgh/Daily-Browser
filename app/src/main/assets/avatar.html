<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic 3D Human Avatar Chat & Movement</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #1a1a1a; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui {
            position: absolute; bottom: 30px; width: 100%; text-align: center;
            color: white; pointer-events: none;
        }
        button {
            pointer-events: auto; padding: 14px 28px; font-size: 16px;
            background: #28a745; color: white; border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #status { margin-bottom: 12px; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 3px black; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="ui">
        <div id="status">Status: Ready to Chat & Move</div>
        <button id="talkBtn">কথা বলুন (Start Talking)</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ১. সিন এবং ক্যামেরা সেটআপ
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // ২. লাইটিং
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(2, 5, 2);
        scene.add(dirLight);

        // ৩. মানবাকৃতির একটি প্রোটোটাইপ বডি (Full Body Structure Simulation)
        const humanGroup = new THREE.Group();

        // মাথা
        const headGeo = new THREE.SphereGeometry(0.3, 32, 32);
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const head = new THREE.Mesh(headGeo, skinMat);
        head.position.set(0, 1.3, 0);
        humanGroup.add(head);

        // শরীর (Torso)
        const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.4);
        const clothMat = new THREE.MeshStandardMaterial({ color: 0x007bff });
        const torso = new THREE.Mesh(bodyGeo, clothMat);
        torso.position.set(0, 0.3, 0);
        humanGroup.add(torso);

        // ডান হাত (Hand for gestures)
        const armGeo = new THREE.BoxGeometry(0.2, 1, 0.2);
        const rightArm = new THREE.Mesh(armGeo, skinMat);
        rightArm.position.set(0.6, 0.5, 0);
        humanGroup.add(rightArm);

        scene.add(humanGroup);

        // ৪. স্বাভাবিক নড়াচড়া ও অ্যানিমেশন লুপ (Natural Idle Motion)
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            // মানুষের মতো হালকা শ্বাস নেওয়া বা নড়ে ওঠার ভঙ্গি (Idle Animation)
            humanGroup.position.y = Math.sin(time * 2) * 0.03;
            rightArm.rotation.z = Math.sin(time * 3) * 0.1;

            renderer.render(scene, camera);
        }
        animate();

        // ৫. ভয়েস রিকগনিশন ও কৃত্রিম বুদ্ধিমত্তা কথোপকথন (Speech & Response)
        const talkBtn = document.getElementById('talkBtn');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'bn-BD'; // বাংলা ভাষা

            talkBtn.addEventListener('click', () => {
                recognition.start();
                document.getElementById('status').innerText = "Status: শুনছি... কথা বলুন।";
            });

            recognition.onresult = (event) => {
                const userSpeech = event.results[0][0].transcript;
                document.getElementById('status').innerText = `আপনি বলেছেন: "${userSpeech}"`;

                // অবতারের প্রতিক্রিয়া এবং কথা বলা
                setTimeout(() => {
                    let reply = "আপনার কথা বুঝতে পেরেছি। বলুন, আর কী করতে পারি?";
                    if (userSpeech.includes('কেমন') || userSpeech.includes('আছেন')) {
                        reply = "আলহামদুলিল্লাহ, আমি ভালো আছি। আপনার কি অবস্থা?";
                    } else if (userSpeech.includes('নাম')) {
                        reply = "আমি আপনার ডিজিটাল অবতার বা এআই সহচর।";
                    }
                    speak(reply);
                }, 500);
            };
        } else {
            talkBtn.style.display = 'none';
            document.getElementById('status').innerText = "ব্রাউজারে ভয়েস সাপোর্ট নেই।";
        }

        // ৬. টেক্সট থেকে কথা বলা (Text to Speech)
        function speak(text) {
            document.getElementById('status').innerText = `Avatar: "${text}"`;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'bn-BD';
            window.speechSynthesis.speak(utterance);
        }

        // স্ক্রিন রিসাইজ হ্যান্ডেল
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
