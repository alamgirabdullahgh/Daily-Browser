<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ডেইলি এডিট</title>
<style>
:root{--bg:#f6f3ea;--card:#fff;--tx:#1b2b24;--mu:#6b7a72;--g:#0f5a3f;--bd:#e3ddcc;--w:#c98a00;--r:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#121a16;--card:#1b2620;--tx:#e8efe9;--mu:#93a39a;--g:#59c796;--bd:#2c3a33;--w:#e5b04a;--r:#f08a82}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Noto Sans Bengali",sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%}
header{padding:10px 14px;font-weight:700;color:var(--g);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
#ts{font-weight:400;font-size:12px;color:var(--mu)}
main{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.hello{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ex button{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:14px;padding:4px 10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.meta{font-size:12px;color:var(--mu);display:flex;justify-content:space-between}
.bar{height:6px;background:var(--bd);border-radius:4px;margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.queued .meta span:first-child{color:var(--w)}.done .meta span:first-child{color:var(--g)}
.note{font-size:13px;color:var(--mu);white-space:pre-wrap;word-break:break-word}.note a{color:var(--g)}
footer{padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;gap:6px}
.box{border:1px solid var(--bd);border-radius:24px;background:var(--bg);padding:10px 10px 8px 14px;display:flex;flex-direction:column;gap:6px}
.box textarea{width:100%;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;font-size:16px;min-height:72px;max-height:40vh;resize:none;padding:0}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tools .sp{flex:1}
select{font:inherit;font-size:13px;color:var(--tx);background:transparent;border:1.5px solid var(--bd);border-radius:18px;height:36px;padding:0 8px}
.send{width:42px;height:42px;border-radius:50%;border:0;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.send:disabled{opacity:.35}
.send svg{width:22px;height:22px}
#setup{padding:12px;display:none;flex-direction:column;gap:8px}#setup input{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
#setup button{font:inherit;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:700;padding:10px}
</style></head><body>
<header><span>🎬 ডেইলি এডিট</span><span id="ts"></span></header>
<div id="setup"><b>প্রথমবার: GitHub টোকেন দিন (শুধু এই ফোনে থাকবে)</b><input id="tok" type="password" placeholder="github_pat_..."><button onclick="saveTok()">সংরক্ষণ</button></div>
<main id="m">
  <div class="hello">কী ধরনের ভিডিও চান লিখুন। আপনার বেছে নেওয়া এজেন্ট ব্রাউজারে ওয়েবসাইট ঘুরে নিজে স্ক্রিপ্ট, অডিও, ছবি ও ভিডিও বানাবে (কোনো API কোটা লাগে না)।
    <div class="ex"><button onclick="ex(this)">একটি হরিণের গল্পের ভিডিও</button><button onclick="ex(this)">আজকের দিনের একটি উপদেশমূলক ভিডিও</button><button onclick="ex(this)">শিশুদের জন্য ছড়ার ভিডিও</button></div></div>
  <div id="tasks"></div>
</main>
<footer id="f"><div class="box"><textarea id="t" placeholder="যেমন: একটি হরিণের গল্পের ভিডিও তৈরি করে দাও" oninput="upd()"></textarea>
  <div class="tools"><select id="ratio"><option value="16:9">আড়াআড়ি 16:9</option><option value="9:16">লম্বা 9:16 (Shorts)</option></select>
  <select id="dur"><option value="15">~১৫ সেকেন্ড</option><option value="30" selected>~৩০ সেকেন্ড</option><option value="60">~১ মিনিট</option></select>
  <select id="ag"></select><span class="sp"></span>
  <button class="send" id="sb" disabled onclick="send()" aria-label="পাঠাও"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div></footer>
<script>
const REPO="alamgirabdullahgh/daily-ruqyah",BR="agent-bus",API=`https://api.github.com/repos/${REPO}/contents/bus.json`,TAG="[ডেইলি এডিট]";
const tok=()=>{try{return localStorage.getItem("gh_tok")||""}catch(e){return""}};
const H=()=>({Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json"});
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const enc=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const link=s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>');
function saveTok(){const v=document.getElementById("tok").value.trim();if(v){try{localStorage.setItem("gh_tok",v)}catch(e){}start()}}
async function load(){const r=await fetch(API+"?ref="+BR+"&t="+Date.now(),{headers:H()});if(!r.ok)throw new Error(r.status);const j=await r.json();return{sha:j.sha,d:JSON.parse(dec(j.content))}}
const SS={queued:"সারিতে",running:"চলছে",done:"শেষ"};
function draw(d){
  const l=[...d.tasks].filter(t=>String(t.text).startsWith(TAG)).reverse();
  document.getElementById("tasks").innerHTML=l.map(t=>{const req=(/অনুরোধ:\s*([^\n]*)/.exec(t.text)||[])[1]||t.text;
    return `<div class="card ${t.status}" style="margin-bottom:8px"><div class="meta"><span>#${t.id} · ${SS[t.status]||t.status}${t.agent?" · "+esc(t.agent):(t.target&&t.status==="queued"?" · → "+esc(t.target):"")}</span><span>${t.progress}%</span></div><div>${esc(req)}</div><div class="bar"><i style="width:${t.progress}%"></i></div>${t.note?`<div class="note">${link(t.note)}</div>`:""}</div>`}).join("");
  document.getElementById("ts").textContent="হালনাগাদ "+new Date().toLocaleTimeString("bn-BD")}
async function refresh(){try{draw((await load()).d)}catch(e){document.getElementById("ts").textContent="সংযোগ সমস্যা ("+e.message+")"}}
let AGS=[{id:"gemini",label:"Gemini"}],SEL="";try{SEL=localStorage.getItem("de_ag")||""}catch(e){}
function drawAg(){const s=document.getElementById("ag");if(!AGS.some(a=>a.id===SEL))SEL=(AGS.find(a=>a.id==="gemini")||AGS[0]).id;
  s.innerHTML=AGS.map(a=>`<option value="${esc(a.id)}"${a.id===SEL?" selected":""}>${esc(a.label)}</option>`).join("");s.onchange=()=>{SEL=s.value;try{localStorage.setItem("de_ag",SEL)}catch(e){}}}
window.setAgents=function(l){try{if(Array.isArray(l)&&l.length)AGS=l;drawAg()}catch(e){}};drawAg();
function upd(){document.getElementById("sb").disabled=!document.getElementById("t").value.trim()}
function ex(b){const t=document.getElementById("t");t.value=b.textContent;upd();t.focus()}
function build(req,ratio,dur){return TAG+" অনুরোধ: "+req+"\n"+
"ভিডিওর ধরন: "+ratio+", দৈর্ঘ্য প্রায় "+dur+" সেকেন্ড, ভাষা: বাংলা।\n"+
"এটা ভিডিও বানানোর কাজ। কোনো API বা কোড লাগবে না: ব্রাউজারে ওয়েবসাইট খুলে নিজে ক্লিক করে করো। ধাপ:\n"+
"১) স্ক্রিপ্ট: অনুরোধ অনুযায়ী ৪–৮টি দৃশ্যের স্ক্রিপ্ট লেখো (প্রতি দৃশ্যে বাংলা narration + ছবির ইংরেজি বর্ণনা; সব ছবির আর্ট স্টাইল ও মূল চরিত্র একই রাখো)।\n"+
"২) অডিও: aistudio.google.com-এর অডিও (Generate speech) ফিচারে পুরো narration দিয়ে ভয়েস বানাও ও ফাইল নামাও।\n"+
"৩) ছবি: প্রতিটি দৃশ্যের ছবি Gemini-র ছবি তৈরির (Nano Banana) ফিচারে বানাও ও নামাও।\n"+
"৪) ভিডিও: ছবি ও অডিও Google Vids (docs.google.com/videos) বা YouTube Shorts-এর ভিডিও তৈরির অপশনে জুড়ে সম্পূর্ণ ভিডিও বানাও।\n"+
"৫) শেষে ভিডিওর লিংক বা ফাইলের নাম কাজের নোটে লেখো। কোনো ধাপে আটকালে (লগইন, ক্যাপচা, লিমিট) কোথায় আটকাল সেটাও নোটে লেখো।"}
async function send(){const t=document.getElementById("t"),sb=document.getElementById("sb"),req=t.value.trim();if(!req)return;
  sb.disabled=true;t.disabled=true;const body=build(req,document.getElementById("ratio").value,document.getElementById("dur").value);
  for(let i=0;i<4;i++){try{const{sha,d}=await load();const id=Math.max(d.seq||0,0,...d.tasks.map(x=>x.id))+1,now=new Date().toISOString().slice(0,16).replace("T"," ");
    d.seq=id;d.tasks.push({id,text:body,status:"queued",agent:"",target:SEL,progress:0,note:"",created:now,updated:now});
    d.events.push({t:now,msg:"নতুন ভিডিও কাজ #"+id+": "+req.slice(0,50)});d.events=d.events.slice(-60);
    const r=await fetch(API,{method:"PUT",headers:H(),body:JSON.stringify({message:"bus: add",branch:BR,sha,content:enc(JSON.stringify(d,null,1))})});
    if(r.ok){t.value="";t.disabled=false;upd();draw(d);return}}catch(e){}await new Promise(r=>setTimeout(r,700))}
  alert("পাঠানো যায়নি, আবার চেষ্টা করুন");t.disabled=false;upd()}
function start(){const ok=!!tok();document.getElementById("setup").style.display=ok?"flex":"none";document.getElementById("setup").style.display=ok?"none":"flex";
  document.getElementById("m").style.display=ok?"flex":"none";document.getElementById("f").style.display=ok?"flex":"none";
  if(ok){refresh();clearInterval(window._i);window._i=setInterval(refresh,15000)}}
start();
</script></body></html>
